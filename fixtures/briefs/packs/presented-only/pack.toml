# Swiss pack v1: the system (spec 002 §5.2, amendment B-8). Every value here is data: the
# pen writes only these tokens, and the pack rules check decks against them. Colours are
# named by role; a voice (voices/*.toml, or a brief's inline [voice]) gives each role its
# value and names the display and text fonts. Direction and reasons: README.md.
schema = 1
name = "swiss"
version = "1.0.0"
modes = ["presented"]
palette_roles = ["paper", "ink", "muted", "hairline", "accent", "accent_on_ink"]
containers = "rules"               # hairlines, not boxes
alignment = "left"                 # flush left, ragged right
accent_budget = 1
accents = ["accent", "accent_on_ink"]
accepted = []

[surfaces.paper]
background = "paper"
text = ["ink", "muted", "accent"]
accent = "accent"                  # what figure(accent=True) uses on this surface

[surfaces.ink]
background = "ink"
text = ["paper", "accent_on_ink"]  # muted on ink is only 2.82 : 1 in the neutral voice
accent = "accent_on_ink"

[grid]                             # plan 002 §2.5; EMU, so every region edge is an integer
columns = 12
gutter_emu = 180000                # 0.50 cm; 12 columns of 761000 EMU (2.114 cm)
margin_x_emu = 540000              # 1.50 cm
margin_y_emu = 549000              # 1.525 cm
row_emu = 90000                    # 0.25 cm; 64 rows fill the content height
rows = 64

[theme]                            # the 12 theme slots, all palette roles (§5.3)
dk1 = "ink"
lt1 = "paper"
dk2 = "muted"
lt2 = "hairline"
accent1 = "accent"
accent2 = "accent_on_ink"
accent3 = "muted"
accent4 = "hairline"
accent5 = "ink"
accent6 = "muted"
hlink = "ink"                      # not accent: a link would spend the slide's accent budget (Q-20)
folHlink = "muted"

[keyline_rule]                     # the pack's one device, drawn by the pen on evidence slides
color = "ink"
row = 18
thickness_emu = 43200              # 0.12 cm

# ---------------------------------------------------------------------------------------
# Type scale. color = { surface = palette role }. font = the voice's display or text family
# (plan Q-27). tracking is a fraction of the size (0.08 = +8 %); line_spacing multiplies
# the 1.2 em line pitch (§6.4).
[styles.presented.cover_title]
font = "display"
size_pt = 66
weight = "bold"
color = { paper = "ink" }
[styles.presented.statement]
font = "display"
size_pt = 60
weight = "bold"
color = { paper = "ink" }
[styles.presented.headline]
font = "display"
size_pt = 48
weight = "bold"
color = { paper = "ink", ink = "paper" }
[styles.presented.quote]
font = "display"
size_pt = 44
weight = "regular"
color = { paper = "ink" }
[styles.presented.lede]
font = "text"
size_pt = 28
weight = "regular"
color = { paper = "ink" }
line_spacing = 1.1
[styles.presented.body]
font = "text"
size_pt = 24
weight = "regular"
color = { paper = "ink" }
line_spacing = 1.1
space_after_pt = 6
bullet_indent_emu = 342900
bullet_marker = "–"
[styles.presented.numeral]
font = "display"
size_pt = 120
weight = "bold"
color = { paper = "ink" }
[styles.presented.label]
font = "text"
size_pt = 14
weight = "bold"
color = { paper = "muted", ink = "accent_on_ink" }
caps = true
tracking = 0.08
[styles.presented.source]
font = "text"
size_pt = 12
weight = "regular"
color = { paper = "muted" }

[styles.read.cover_title]
font = "display"
size_pt = 40
weight = "bold"
color = { paper = "ink" }
[styles.read.statement]
font = "display"
size_pt = 36
weight = "bold"
color = { paper = "ink" }
[styles.read.headline]
font = "display"
size_pt = 28
weight = "bold"
color = { paper = "ink", ink = "paper" }
[styles.read.quote]
font = "display"
size_pt = 24
weight = "regular"
color = { paper = "ink" }
[styles.read.lede]
font = "text"
size_pt = 16
weight = "regular"
color = { paper = "ink" }
line_spacing = 1.1
[styles.read.body]
font = "text"
size_pt = 13
weight = "regular"
color = { paper = "ink" }
line_spacing = 1.1
space_after_pt = 4
bullet_indent_emu = 228600
bullet_marker = "–"
[styles.read.numeral]
font = "display"
size_pt = 60
weight = "bold"
color = { paper = "ink" }
[styles.read.label]
font = "text"
size_pt = 10
weight = "bold"
color = { paper = "muted", ink = "accent_on_ink" }
caps = true
tracking = 0.08
[styles.read.source]
font = "text"
size_pt = 9
weight = "regular"
color = { paper = "muted" }

# ---------------------------------------------------------------------------------------
# Roles (§5.2 "components allowed per role"). components: component -> allowed styles.
[roles.cover]
surface = "paper"
title = "cover_title"
layouts = ["keyline:cover"]
components.presented = { text = ["lede"], source = ["source"], note = ["source"] }
components.read = { text = ["lede"], source = ["source"], note = ["source"] }

[roles.section]
surface = "ink"
title = "headline"
layouts = ["keyline:section"]
components.presented = { text = ["label"] }
components.read = { text = ["label"] }

[roles.statement]
surface = "paper"
title = "statement"
layouts = ["keyline:statement"]
components.presented = { text = ["lede", "body"], figure = ["numeral", "label"], source = ["source"], note = ["source"] }
components.read = { text = ["lede", "body"], figure = ["numeral", "label"], source = ["source"], note = ["source"] }

[roles.evidence]
surface = "paper"
title = "headline"
layouts = ["keyline:evidence", "keyline:evidence:figure"]
components.presented = { text = ["body"], bullets = ["body"], figure = ["numeral", "label"], table = ["body", "label"], chart_bar = ["label", "source"], image = [], source = ["source"], note = ["source"] }
components.read = { text = ["body", "lede"], bullets = ["body"], figure = ["numeral", "label"], table = ["body", "label"], chart_bar = ["label", "source"], image = [], source = ["source"], note = ["source"] }

[roles.quote]
surface = "paper"
title = "quote"
layouts = ["keyline:quote"]
components.presented = { attribution = ["label"] }
components.read = { attribution = ["label"] }

[roles.close]
surface = "paper"
title = "cover_title"
layouts = ["keyline:close"]
components.presented = { text = ["lede"], figure = ["numeral", "label"], source = ["source"], note = ["source"] }
components.read = { text = ["lede"], figure = ["numeral", "label"], source = ["source"], note = ["source"] }

# ---------------------------------------------------------------------------------------
# Regions per layout, in grid units: col 1-12, span columns, row 0-63, rows tall. A region
# covers [row, row + rows). `anchor` is where its text sits: "t" from the top, "b" down on the
# bottom (audit 05 FX-24: the cover, evidence and close titles sit on the lede or the rule). Every layout has a "title" region; "footer" holds the source
# line then the note line (§6.1). Shared by both modes; sized for the larger presented
# type (plan §2.5).
[regions."keyline:cover"]
title = { col = 1, span = 10, row = 14, rows = 24, anchor = "b" }
main = { col = 1, span = 10, row = 40, rows = 16, anchor = "t" }
footer = { col = 1, span = 12, row = 58, rows = 6, anchor = "t" }

[regions."keyline:section"]
title = { col = 1, span = 10, row = 22, rows = 18, anchor = "t" }
main = { col = 1, span = 10, row = 42, rows = 4, anchor = "t" }

[regions."keyline:statement"]
title = { col = 1, span = 10, row = 2, rows = 31, anchor = "t" }
main = { col = 1, span = 10, row = 34, rows = 23, anchor = "t" }
footer = { col = 1, span = 12, row = 58, rows = 6, anchor = "t" }

[regions."keyline:evidence"]
title = { col = 1, span = 12, row = 0, rows = 17, anchor = "b" }
main = { col = 1, span = 12, row = 20, rows = 37, anchor = "t" }
footer = { col = 1, span = 12, row = 58, rows = 6, anchor = "t" }

[regions."keyline:evidence:figure"]
title = { col = 1, span = 12, row = 0, rows = 17, anchor = "b" }
main = { col = 1, span = 8, row = 20, rows = 37, anchor = "t" }
side = { col = 9, span = 4, row = 20, rows = 37, anchor = "t" }
footer = { col = 1, span = 12, row = 58, rows = 6, anchor = "t" }

[regions."keyline:quote"]
title = { col = 1, span = 10, row = 6, rows = 40, anchor = "t" }
main = { col = 1, span = 10, row = 48, rows = 3, anchor = "t" }

[regions."keyline:close"]
title = { col = 1, span = 10, row = 8, rows = 24, anchor = "b" }
main = { col = 1, span = 10, row = 34, rows = 23, anchor = "t" }
footer = { col = 1, span = 12, row = 58, rows = 6, anchor = "t" }

# ---------------------------------------------------------------------------------------
# Template placeholders (§5.3, plan Q-21). Every region that holds text is a placeholder;
# the title region is the title placeholder, the others are body placeholders with a fixed
# idx, so switching layouts in PowerPoint keeps text in the matching region. Each carries
# the style below, so text typed into it by hand lands on the scale.
[placeholders]
idx = { main = 1, side = 2, footer = 3 }

[placeholders.styles]
"keyline:cover" = { main = "lede", footer = "source" }
"keyline:section" = { main = "label" }
"keyline:statement" = { main = "lede", footer = "source" }
"keyline:evidence" = { main = "body", footer = "source" }
"keyline:evidence:figure" = { main = "body", side = "body", footer = "source" }
"keyline:quote" = { main = "label" }
"keyline:close" = { main = "lede", footer = "source" }
