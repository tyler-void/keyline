# Expectations for fixtures/rules/*.pptx. One [[case]] per (deck, mode).
#   must     = findings that must appear:     "rule@shape_name[:severity]" or "rule@-" (no shape)
#   must_not = rule ids (optionally "rule@shape") that must not appear at warning or error
#   absent   = rule ids (optionally "rule@shape") that must not appear at any severity
# Built by fixtures/rules/src/build_rules.py; checked by tests/rules/test_rule_fixtures.py.

[[case]]
deck = "off-slide--pos.pptx"
must = ["off-slide@over-right:error", "off-slide@rotated:error", "off-slide@bleed:advisory"]

[[case]]
deck = "off-slide--neg.pptx"
must_not = ["off-slide"]

[[case]]
deck = "edge-margin--pos.pptx"
must = [
  "edge-margin@near-left:warning",
  "edge-margin@near-bottom:warning",
  "edge-margin@pic-top:warning",
  "edge-margin@chart-right:warning",
]

[[case]]
deck = "edge-margin--neg.pptx"
must_not = ["edge-margin"]

[[case]]
deck = "dead-band--pos.pptx"
must = ["dead-band@-:warning"]

[[case]]
deck = "dead-band--neg.pptx"
must_not = ["dead-band"]

[[case]]
deck = "box-overlap--pos.pptx"
must = ["box-overlap@first:advisory"]

[[case]]
deck = "box-overlap--neg.pptx"
absent = ["box-overlap"]

[[case]]
deck = "body-too-small--pos.pptx"
mode = "presented"
must = [
  "body-too-small@body:warning",
  "body-too-small@read-body:warning",
  "body-too-small@tiny:warning",
]

[[case]]
deck = "body-too-small--pos.pptx"
mode = "read"
must = ["body-too-small@tiny:warning"]
must_not = ["body-too-small@body", "body-too-small@read-body"]

[[case]]
deck = "body-too-small--neg.pptx"
must_not = ["body-too-small"]

[[case]]
deck = "title-not-dominant--pos.pptx"
must = ["title-not-dominant@title:warning"]

[[case]]
deck = "title-not-dominant--neg.pptx"
must_not = ["title-not-dominant"]

[[case]]
deck = "text-contrast--pos.pptx"
must = ["text-contrast@label:warning", "text-contrast@on-card:warning"]

[[case]]
deck = "text-contrast--neg.pptx"
must = ["text-contrast@on-gradient:advisory"]
must_not = ["text-contrast"]

[[case]]
deck = "notes-missing--pos.pptx"
mode = "presented"
must = ["notes-missing@-:warning"]

[[case]]
deck = "notes-missing--pos.pptx"
mode = "read"
must = ["notes-missing@-:advisory"]
must_not = ["notes-missing"]

[[case]]
deck = "notes-missing--neg.pptx"
absent = ["notes-missing"]

[[case]]
deck = "font-count--pos.pptx"
must = ["font-count@-:warning"]

[[case]]
deck = "font-count--neg.pptx"
must_not = ["font-count"]

[[case]]
deck = "title-underline--pos.pptx"
must = ["title-underline@underline:warning"]

[[case]]
deck = "title-underline--neg.pptx"
must_not = ["title-underline"]

[[case]]
deck = "equal-card-row--pos.pptx"
must = ["equal-card-row@card-a:warning", "equal-card-row@kpi-a:warning"]

[[case]]
deck = "equal-card-row--neg.pptx"
must_not = ["equal-card-row"]

# ---------- spec 002 §3.4 ----------
[[case]]
deck = "claude-look-palette--pos.pptx"
must = ["claude-look-palette@-:warning"]

[[case]]
deck = "claude-look-palette--neg.pptx"
absent = ["claude-look-palette"]

[[case]]
deck = "claude-look-palette--cream-only.pptx"
must = ["claude-look-palette@-:advisory"]
must_not = ["claude-look-palette"]

[[case]]
deck = "claude-look-palette--cool.pptx"
absent = ["claude-look-palette"]

[[case]]
deck = "title-too-long--pos.pptx"
mode = "presented"
must = ["title-too-long@long-title:warning"]

[[case]]
deck = "title-too-long--pos.pptx"
mode = "read"
absent = ["title-too-long"]

[[case]]
deck = "title-too-long--neg.pptx"
absent = ["title-too-long"]

[[case]]
deck = "closing-cliche--pos.pptx"
must = ["closing-cliche@closing-title:warning"]

[[case]]
deck = "closing-cliche--neg.pptx"
absent = ["closing-cliche"]

# ---------- spec 002 §3.4: pack rules (AC-3). pack = "swiss" and, from B-8.8, a voice ----------
[[case]]
deck = "off-palette-color--pos.pptx"
pack = "swiss"
voice = "neutral"
must = [
  "off-palette-color@off-ink:warning",
  "off-palette-color@off-fill:warning",
  "off-palette-color@-:warning",
]

[[case]]
deck = "off-palette-color--neg.pptx"
pack = "swiss"
voice = "neutral"
absent = ["off-palette-color"]

[[case]]
deck = "off-scale-size--pos.pptx"
pack = "swiss"
voice = "neutral"
must = ["off-scale-size@twenty:warning", "off-scale-size@shrunk:warning"]

[[case]]
deck = "off-scale-size--neg.pptx"
pack = "swiss"
voice = "neutral"
absent = ["off-scale-size"]

[[case]]
deck = "off-scale-size--neg.pptx"
mode = "read"
pack = "swiss"
voice = "neutral"
must = ["off-scale-size@numeral:warning"]  # 120 pt is not on the read scale ...
absent = ["off-scale-size@fitted"]          # ... but 24 pt is

[[case]]
deck = "off-pack-font--pos.pptx"
pack = "swiss"
voice = "neutral"
must = ["off-pack-font@-:warning"]

[[case]]
deck = "off-pack-font--neg.pptx"
pack = "swiss"
voice = "neutral"
absent = ["off-pack-font"]

[[case]]
deck = "accent-overuse--pos.pptx"
pack = "swiss"
voice = "neutral"
must = ["accent-overuse@-:warning"]

[[case]]
deck = "accent-overuse--neg.pptx"
pack = "swiss"
voice = "neutral"
absent = ["accent-overuse"]

[[case]]
deck = "accent-overuse--pos.pptx"   # without a pack the pack rules do not run
absent = ["accent-overuse", "off-palette-color", "off-scale-size", "off-pack-font"]

# The same system in other voices (B-8.8): a deck in its own voice is clean; read against
# another voice, its colours and fonts are off.
[[case]]
deck = "pack-voice-night.pptx"
pack = "swiss"
voice = "night"
absent = ["off-palette-color", "off-scale-size", "off-pack-font", "accent-overuse"]

[[case]]
deck = "pack-voice-night.pptx"
pack = "swiss"
voice = "neutral"
must = ["off-palette-color@-:warning", "off-palette-color@numeral:warning"]
absent = ["off-pack-font"]

[[case]]
deck = "pack-voice-field.pptx"
pack = "swiss"
voice = "field"
absent = ["off-palette-color", "off-scale-size", "off-pack-font", "accent-overuse"]

[[case]]
deck = "pack-voice-field.pptx"
pack = "swiss"
voice = "neutral"
must = ["off-pack-font@-:warning", "off-palette-color@keyline:warning"]
