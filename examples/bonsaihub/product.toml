# BonsaiHub: product truth for keyline's canonical demo decks (spec 002, section 10).
#
# Provided by the auditor. Do not edit this file. Decks and briefs are built from it
# as it is; if something here looks wrong, report it (constitution VI).
#
# Everything in this file is fictional. BonsaiHub is a parody product: a swipe-dating
# app and a "hub" photo feed, both for bonsai trees. No company, person, tree or number
# here is real. Keep it safe for work: the joke is treating trees with total dating-app
# seriousness, nothing more.

schema = 1

[product]
name = "BonsaiHub"
one_liner = "A dating app for bonsai trees and the people patient enough to keep them."
fictional = true
disclosure = "Note: BonsaiHub is a parody. Its trees and every number in this deck are fictional."
tone = "Deadpan. Trees are presented with full dating-app seriousness; the product itself is earnest about patience."

[product.world]
# Raw material for the brief's own_world and motif. The brief picks from it; it does not
# have to use all of it.
materials = [
  "copper training wire",
  "akadama soil",
  "unglazed stoneware pot",
  "moss",
  "concave pruning shears",
  "turntable stand",
]
vocabulary = [
  "the front: the side a tree is styled to be seen from",
  "nebari: the visible surface roots",
  "jin and shari: deadwood, stripped and bleached",
  "ramification: the fine branching built over years",
  "repotting",
  "yamadori: a tree collected from the wild",
  "shohin: a bonsai small enough to hold in one hand",
]
time = "Trees are styled over decades. On BonsaiHub a match is measured in seasons, not seconds."

[product.brand]
# Constitution X (public hygiene) and the brief's own-world rule, applied to a parody.
must_not = [
  "imitate any real company's logo, wordmark, colour lockup or app interface",
  "use a black-and-orange 'Hub' lockup or any look taken from an adult website",
  "use a flame icon, swipe-card chrome or any look taken from a real dating app",
  "show real people, real brands or screenshots of real products",
]

[[feature]]
id = "swipe"
name = "Swipe the front"
what = "A profile shows a tree from its front, with its age and its care needs. Swipe right to ask for a visit."

[[feature]]
id = "slow-match"
name = "Slow Match"
what = "A match unlocks only after a full season of visits, so nobody adopts a juniper on impulse."

[[feature]]
id = "hub"
name = "The Hub"
what = "A feed of shamelessly beautiful tree photography: close-ups of surface roots, bark and deadwood."

[[feature]]
id = "wire-check"
name = "Wire Check"
what = "Reminds keepers to take training wire off before it cuts into the bark."

[[audience]]
id = "demo-day"
who = "Angel investors at a demo day. Five-minute slot, deck on a projector, no handout."
decision = "Book a second meeting about the seed round."
mode = "presented"

[[audience]]
id = "team-preread"
who = "The BonsaiHub team, reading on their own before the Q4 planning meeting."
decision = "Approve launching Slow Match in Da Lat and Kyoto before building any new feature."
mode = "read"

[[profile]]
# Parody dating profiles. Ages are evidence entries (see profile_* below).
id = "itoigawa"
tree = "Shimpaku juniper, collected from the wild"
age_evidence = "profile_itoigawa_age"
looking_for = "Someone who stays for decades."
likes = "Morning sun, akadama, being left alone in winter."
dealbreakers = "Overwatering. Wire left on past August."

[[profile]]
id = "maple"
tree = "Trident maple, shohin"
age_evidence = "profile_maple_age"
looking_for = "A keeper who notices the small branches."
likes = "Autumn, a shallow pot, gentle repotting every other spring."
dealbreakers = "Full afternoon sun. Impatience."

# Evidence on hand. Every number a deck shows must come from here (spec 002, section 4).
# Exactly one of `value` or `series` per entry. `aliases` lists other accepted renderings.
# Every label is at most 5 words, so it can sit under a numeral as a caption.

[[evidence]]
id = "waitlist_trees"
value = "12,400"
label = "trees on the waitlist"
source = "BonsaiHub waitlist, September 2026 (fictional)"

