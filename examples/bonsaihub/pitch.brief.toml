decision = "Book a second meeting about the $1.2M seed round"
thesis = "Making every match wait a full season is why BonsaiHub adoptions last"
own_world = ["copper training wire", "akadama soil", "unglazed stoneware pot", "moss", "concave pruning shears"]
motif = "A visit: a right swipe asks a tree for one, Slow Match needs a season of them, and the close asks the room for a second"

