line-length = 100
target-version = "py311"
extend-exclude = [
  "prototype",
  "fixtures/foreign/stress/src",  # audit 02 scripts, kept close to verbatim
  "specs/*/evidence",             # auditor evidence (e.g. spec 002's numbers_ref.py), never edited
]

[lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # prose uses ·, ×, − and similar on purpose
