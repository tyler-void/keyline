# keyline thresholds (spec 001 §5). Values are data, not code (constitution V).
# None of these has been measured against human-labelled decks yet.
calibrated = false

# Keys that do not depend on the mode. A mode table may override any of them.
[common]
caption_exempt_words = 5        # a paragraph needs more words than this to be body text
edge_margin_cm = 1.27
edge_margin_tolerance_cm = 0.05 # explicit, so 1.25 cm is not a finding
dead_band_ratio = 0.25
contrast_normal = 4.5           # WCAG 2.x
contrast_large = 3.0
large_text_pt = 18              # WCAG 2.x large text: >= 18 pt ...
large_text_bold_pt = 14         # ... or >= 14 pt bold
font_family_max = 2
# Fixed values from the spec's rule table (§6), kept here so every number is data.
off_slide_tolerance_cm = 0.05
background_coverage_min = 0.95
backing_coverage_min = 0.90     # A-15: contrast backing covers this much of the text box
box_overlap_min_cm = 0.1
kpi_numeral_min_pt = 48
kpi_numeral_max_words = 5
underline_max_height_cm = 0.35
underline_max_gap_cm = 1.0
underline_max_left_offset_cm = 1.0
underline_max_width_ratio = 0.5
card_min_count = 3
card_size_tolerance = 0.03
card_row_tolerance_cm = 0.2
card_gap_tolerance_cm = 0.3
card_center_tolerance = 0.03
# spec 002 §3.2 (initial values)
source_prefixes = ["source", "sources", "nguồn"]
note_prefixes = ["note", "notes", "ghi chú"]
neutral_chroma_max = 1.5          # CIELAB C*; pack paper must be at or below
cream_lightness_min = 88          # CIELAB L*
cream_chroma_max = 20             # cream: neutral_chroma_max < C* <= this
cream_hue_min = 60                # CIELAB h, degrees
cream_hue_max = 115
cream_slide_ratio = 0.5
terracotta_hue_min = 10           # HSL hue, degrees
terracotta_hue_max = 25
terracotta_sat_min = 0.35         # HSL saturation
terracotta_sat_max = 0.90
terracotta_light_min = 0.35       # HSL lightness
terracotta_light_max = 0.70
closing_cliches = ["thank you", "thanks", "thank you for listening", "questions",
  "any questions", "q&a", "key takeaways", "in conclusion", "the end",
  "cảm ơn", "xin cảm ơn", "cám ơn", "cảm ơn đã lắng nghe", "hỏi đáp"]
mood_words = ["clean", "modern", "elegant", "premium", "sleek", "minimal", "minimalist",
  "bold", "vibrant", "professional", "innovative", "dynamic", "cutting-edge",
  "seamless", "fresh", "stylish"]
statement_min_slides = 6          # brief-no-statement applies at or above this length
# spec 002 B-10: the only rules a pack or voice may list in `accepted` (as advisory). The
# gates (sources, disclosure, slide count, contrast …) can never be waived by the author.
acceptable_rules = ["claude-look-palette", "voice-claude-look", "closing-cliche",
  "accent-overuse", "equal-card-row", "title-underline"]
# spec 002 B-8.3: the families a voice may use. Each ships with Windows and macOS, or with
# Office, and has an open metric-compatible twin, which renders and fit estimates use.
portable_fonts = [
  { family = "Arial",           metric_twin = "Liberation Sans" },
  { family = "Times New Roman", metric_twin = "Liberation Serif" },
  { family = "Courier New",     metric_twin = "Liberation Mono" },
  { family = "Georgia",         metric_twin = "Gelasio" },
  { family = "Calibri",         metric_twin = "Carlito" },
  { family = "Cambria",         metric_twin = "Caladea" },
]

[presented]
body_min_pt = 18
title_ratio_min = 2.0
title_words_max = 10              # spec 002 §3.2
source_min_pt = 12
reads_max = 3                     # brief
bullets_max = 4                   # pen
numerals_max = 1                  # pen: figure() calls per slide

[read]
body_min_pt = 11
title_ratio_min = 1.6
title_words_max = 15
source_min_pt = 9
reads_max = 5
bullets_max = 6
numerals_max = 2
